name: ${COMPOSE_PROJECT_NAME:?Define COMPOSE_PROJECT_NAME in the environment file}

services:
  app:
    image: ${APP_IMAGE:?Define APP_IMAGE in the environment file}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Define MYSQL_DATABASE in .env}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Define MYSQL_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Define SPRING_PROFILES_ACTIVE in the environment file}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:?Define SPRING_JPA_HIBERNATE_DDL_AUTO in the environment file}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:?Define SPRING_JPA_SHOW_SQL in the environment file}
      LOG_LEVEL: ${LOG_LEVEL:?Define LOG_LEVEL in the environment file}
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:8080/actuator/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: 'on-failure:3'
    networks:
      - redfish-network

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - redfish-network

volumes:
  mysql-data:
    name: ${MYSQL_VOLUME_NAME:?Define MYSQL_VOLUME_NAME in the environment file}

networks:
  redfish-network:
    name: ${NETWORK_NAME:?Define NETWORK_NAME in the environment file}
    driver: bridge
