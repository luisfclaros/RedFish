services:
  app:
    build: .
    profiles:
      - container
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/redfish'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=redfish'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -umyuser -psecret']
      interval: 10s
      timeout: 5s
      retries: 5
